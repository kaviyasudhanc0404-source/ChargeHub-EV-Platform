# Render Blueprint for the ChargeHub API (Render dashboard → New → Blueprint → pick this repository).
# Values marked `sync: false` are asked for once when the Blueprint is created; keep them out of git.
services:
  - type: web
    name: chargehub-api
    runtime: node
    plan: free
    region: singapore # closest Render region to India; it cannot be changed after the service is created
    rootDir: ChargeHub_backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # random 256-bit secret, generated by Render
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL # your Vercel URL, e.g. https://chargehub.vercel.app (comma-separate several)
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: ORS_API_KEY
        sync: false
